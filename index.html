<!doctype html>
<html lang="th" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STOCK">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>STOCK รถมือสอง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>

/* Layout: thin top bar + tab strip; stock = list | detail split; plate chip (Thai licence plate) is the recurring signature element */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --surface-2:#F5F8F8; --ink:#12262B; --muted:#586C71; --line:#D6E0E2;
  --accent:#0E7C86; --accent-ink:#FFFFFF; --accent-soft:#DDF1F2;
  --ok:#1F7A4D; --ok-soft:#DFF3E8; --warn:#8F5400; --warn-soft:#FBEBC8; --crit:#B3261E; --crit-soft:#FADFDC;
  --plate-bg:#FFFFFF; --plate-fg:#101418; --plate-line:#2A3236;
  --paper:#FFFFFF; --paper-ink:#14181A; --paper-line:#9AA3A6;
  --chat-bg:#CBD8E4; --bubble:#FFFFFF; --bubble-ink:#14181A; --line-green:#06C755;
  --font:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1A1D; --surface:#14252A; --surface-2:#192C31; --ink:#E6EEF0; --muted:#93A8AD; --line:#26393E;
  --accent:#3CB8C3; --accent-ink:#06262A; --accent-soft:#143C41;
  --ok:#5CC98F; --ok-soft:#173A2A; --warn:#F0B45A; --warn-soft:#3A2D12; --crit:#F2877F; --crit-soft:#3E1B18;
  --chat-bg:#26343F; --bubble:#1D2A33; --bubble-ink:#E6EEF0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1A1D; --surface:#14252A; --surface-2:#192C31; --ink:#E6EEF0; --muted:#93A8AD; --line:#26393E;
  --accent:#3CB8C3; --accent-ink:#06262A; --accent-soft:#143C41;
  --ok:#5CC98F; --ok-soft:#173A2A; --warn:#F0B45A; --warn-soft:#3A2D12; --crit:#F2877F; --crit-soft:#3E1B18;
  --chat-bg:#26343F; --bubble:#1D2A33; --bubble-ink:#E6EEF0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1280px;margin:0 auto;padding-block:12px 28px}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px 10px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{margin:0;font-size:22px;letter-spacing:.06em;font-weight:700}
.tag{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;padding:8px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:600}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--crit);color:#fff;font-size:11px;line-height:18px;text-align:center}
.note-bar{font-size:12px;color:var(--muted);padding-bottom:10px}

/* plate */
.plate{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;padding:3px 9px 2px;border:1.5px solid var(--plate-line);border-radius:5px;background:var(--plate-bg);color:var(--plate-fg);min-width:78px}
.plate b{font-family:var(--font);font-weight:600;font-size:14px;white-space:nowrap}
.plate i{font-style:normal;font-size:10px}
.plate.lg b{font-size:22px}.plate.lg i{font-size:12px}.plate.lg{padding:5px 14px 3px;border-radius:7px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:6px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:13px}
.chip{border:1px solid var(--line);background:var(--surface);padding:3px 11px;border-radius:99px;font-size:13px;color:var(--muted)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
textarea{min-height:64px;resize:vertical}
label.f{display:grid;gap:3px;font-size:12px;color:var(--muted);font-weight:500}

/* stock split */
.stock{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:14px;align-items:start}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.list-head{padding:12px;display:grid;gap:10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);border-radius:10px 10px 0 0;z-index:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.rows{max-height:calc(100vh - 230px);min-height:320px;overflow:auto}
.row{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:10px 12px}
.row:hover{background:var(--surface-2)}
.row[aria-current=true]{background:var(--accent-soft)}
.thumb{width:76px;height:56px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.thumb svg{width:92%}
.row .m{min-width:0}.row .m strong{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;display:grid;gap:4px;justify-items:end;font-size:12px;color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

.dh{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:20px;font-weight:600}
.dh .sub{color:var(--muted);font-size:13px}
.dh .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.back{display:none}
.alerts{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 0}
.stbar{display:flex;gap:6px;flex-wrap:wrap;padding:12px 16px}
.dbody{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;padding:4px 16px 16px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:500;min-width:0;overflow-wrap:anywhere}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px 18px}
.ph{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);background:var(--surface-2);position:relative;overflow:hidden}
.ph.has{border-style:solid}
.ph small{position:absolute;left:8px;bottom:6px}
.sec{padding:0 16px;margin:6px 0 8px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}

/* two-column generic */
.two{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:14px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.card h3{margin:0;font-size:15px;font-weight:600}
.hint{font-size:12px;color:var(--muted);margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:center}

/* alerts view */
.three{display:grid;grid-template-columns:minmax(240px,300px) 1fr minmax(280px,360px);gap:14px;align-items:start}
.rule{display:grid;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border:0}
.rule .h{display:flex;gap:10px;align-items:center;justify-content:space-between}
.rule .h label{display:flex;gap:8px;align-items:center;font-weight:600}
.rule .p{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.rule .p input{width:72px}
.arow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.arow:last-child{border:0}
.arow .t{margin-left:auto}
.chat{background:var(--chat-bg);border-radius:10px;padding:14px;display:grid;gap:14px}
.chat .oa{display:flex;gap:8px;align-items:center;font-weight:600}
.chat .oa i{width:26px;height:26px;border-radius:50%;background:var(--line-green);display:inline-block}
.msg small{display:block;font-size:11px;color:var(--muted);margin:0 0 3px 4px}
.bubble{background:var(--bubble);color:var(--bubble-ink);padding:10px 12px;border-radius:4px 14px 14px 14px;white-space:pre-line;max-width:92%;font-size:13px;line-height:1.55}

/* inspection (mirrors the shop's paper form) */
.sec0{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-top:4px}
.ck{display:grid;grid-template-columns:minmax(0,1.6fr) 140px minmax(0,1fr);gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ck.done .tick{color:var(--ok)}
.tick{display:flex;gap:8px;align-items:center;font-weight:500;min-width:0}
.tick span{flex:1;min-width:0}
.tick input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.ck input[type=text],.ck input[type=date],.inl input[type=date],.mini{padding:5px 8px}
.inl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inl input[type=date]{width:auto}
.docs-f{display:grid;gap:10px}
@media (max-width:560px){.ck{grid-template-columns:1fr 1fr}.ck .tick{grid-column:1/-1}}

/* paper (handover) */
.paper-wrap{overflow:auto}
.paper{background:var(--paper);color:var(--paper-ink);width:100%;max-width:794px;margin:0 auto;padding:36px 40px;border:1px solid var(--line);box-shadow:0 2px 14px rgba(0,0,0,.14);font-size:13px}
.paper h2{margin:0;font-size:20px;text-align:center}
.paper .shop{text-align:center;color:#4a5457;font-size:12px;margin-bottom:14px}
.paper .pt{font-weight:600;border-bottom:1.5px solid var(--paper-ink);margin:16px 0 6px;padding-bottom:3px}
.paper table{width:100%;border-collapse:collapse}
.paper td{padding:4px 6px;border-bottom:1px solid #d3d8da;vertical-align:top}
.paper td:nth-child(odd){color:#4a5457;width:18%}
.paper .tot td{font-weight:600;border-bottom:1.5px solid var(--paper-ink)}
.paper .dl{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
.paper .terms{font-size:12px;color:#33393b;margin:0;padding-left:18px}
.paper .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:38px;text-align:center}
.paper .sign div{border-top:1px solid var(--paper-ink);padding-top:4px;font-size:12px}

/* form paper (ใบตรวจสภาพก่อนส่งมอบ) */
.paper.form{padding:26px 30px;font-size:14px;min-width:660px}
.paper.form td{color:inherit;width:auto;border:0;padding:0}
.paper.form .hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;margin-bottom:12px}
.paper.form .hd h2{grid-column:2;font-size:22px;margin:0}
.paper.form .shopname{grid-column:3;justify-self:end;text-align:right;line-height:1.25;font-weight:700;color:#c8281e;font-size:15px}
.paper.form .shopname small{display:block;color:#7a6a2a;font-weight:500;font-size:11px;letter-spacing:.1em}
.pr{display:flex;gap:16px;align-items:flex-end;margin:8px 0}
.pf{display:flex;gap:5px;align-items:flex-end;min-width:0}
.pf>b{font-weight:500;white-space:nowrap}
.pf>span{flex:1;border-bottom:1px solid #111;min-height:21px;padding:0 4px;min-width:36px;overflow:hidden;white-space:nowrap}
.cbx{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.bx{display:inline-block;width:15px;height:15px;border:2px solid #111;position:relative;flex:none;vertical-align:middle}
.bx.on::after{content:"";position:absolute;left:3px;top:-3px;width:5px;height:10px;border:solid #111;border-width:0 2.5px 2.5px 0;transform:rotate(40deg)}
.u{display:inline-block;border-bottom:1px solid #111;text-align:center;padding:0 4px;min-height:18px}
.paper.form .ft{border-collapse:collapse;width:100%;margin-top:12px;table-layout:fixed}
.paper.form .ft th{border:1px solid #111;padding:5px 6px;font-weight:700;text-align:center}
.paper.form .ft th.cb{border:0}
.paper.form .ft td.c{border:1px solid #111;padding:3px 7px;height:31px;font-size:13px;overflow:hidden;white-space:nowrap}
.paper.form .ft td.cb{text-align:center}
.paper.form .dwrap{display:grid;grid-template-columns:1fr 240px;gap:18px;margin-top:14px}
.paper.form .dt{text-align:center;font-weight:700;margin-bottom:6px}
.paper.form .dr{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0;font-size:13px}
.paper.form .box{border:3px solid #111;border-radius:26px;min-height:150px;padding:12px 16px;font-size:12px;white-space:pre-wrap;overflow:hidden}

/* handover paper (ใบแจ้งรายละเอียดวันส่งมอบรถ) */
.paper.ho{padding:22px 26px;font-size:13px;min-width:720px}
.paper.ho td{color:inherit;width:auto;border:0;padding:0}
.ho .top2{display:grid;grid-template-columns:1fr auto;align-items:start}
.ho .logo{font-weight:700;color:#c8281e;font-size:19px;line-height:1.15}
.ho .logo small{display:block;color:#555;font-size:9px;font-weight:500;letter-spacing:.08em}
.ho .dtr{text-align:right;line-height:1.7;font-size:14px}
.paper.ho h2{margin:0 0 6px;font-size:17px}
.ho .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.ho .cols h3{text-align:center;margin:6px 0;font-size:20px}
.ho .big{border-collapse:collapse;width:100%;table-layout:fixed;margin-bottom:12px}
.ho .big td{border:1.5px solid #111;padding:4px 10px;height:38px;vertical-align:middle;overflow-wrap:anywhere}
.ho .big td.l{font-weight:700;width:38%}
.ho .big.tall td{height:34px}
.ho .three3{display:grid;grid-template-columns:1.1fr 1.45fr 1.3fr;gap:14px;margin-top:2px;align-items:start}
.ho .three3 h4{text-align:center;margin:0 0 5px;font-size:14px;min-height:20px}
.ho .sm{border-collapse:collapse;width:100%;table-layout:fixed;font-size:11px}
.ho .sm td{border:1px solid #333;padding:2px 6px;height:24px;vertical-align:middle;overflow:hidden;white-space:nowrap}
.ho .sm td.r{text-align:right}
.ho .sm td.b{width:38px}
.ho .sm tr.hl td{background:#ffdc5a}
.ho .stmt{font-weight:700;font-size:15px;line-height:2.2;margin:20px 0 4px}
.ho .stmt .u{font-weight:600;min-height:20px}
.ho .stmt .ul{text-decoration:underline}
.ho .rem{font-weight:700;font-size:15px;margin-top:16px;min-height:90px;white-space:pre-wrap}
.ho .rem span{font-weight:400;font-size:13px}
.ho .sg{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-weight:700;font-size:15px;margin-top:14px;line-height:2.2}

/* modal */
.ov{position:fixed;inset:0;background:rgba(5,15,18,.55);display:grid;place-items:center;padding:16px;z-index:20}
.dlg{background:var(--surface);border-radius:12px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px;display:grid;gap:14px;border:1px solid var(--line)}
.dlg h3{margin:0}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end}

@media (max-width:1020px){.three{grid-template-columns:1fr}.three>*{order:0}}
@media (max-width:820px){
  .stock{grid-template-columns:1fr}
  .stock .detail-pane{display:none}
  .stock.show-detail .list-pane{display:none}
  .stock.show-detail .detail-pane{display:block}
  .back{display:inline-block}
  .two{grid-template-columns:1fr}
  .rows{max-height:none}
  .dbody{grid-template-columns:1fr}
  .paper{padding:22px 18px}
  .tabs{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:no-preference){.row{transition:background .12s}}

:root,:root[data-theme="light"]{--bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F6F8F9;--line:#E3E8EA;color-scheme:light}
body{background:#fff}
.card,.pane,.paper-wrap{box-shadow:none}
/* ---- เพิ่มสำหรับแอปจริง ---- */
.who{display:flex;gap:8px;align-items:center}
.login{min-height:100vh;display:grid;place-items:center;padding:16px}
.login .card{width:100%;max-width:380px}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:50;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--crit);color:#fff}
.thumb img{width:100%;height:100%;object-fit:cover}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph>a{display:block;width:100%;height:100%}
label.ph{cursor:pointer}label.ph:hover{border-color:var(--accent);color:var(--accent)}
.ph small{background:rgba(0,0,0,.55);color:#fff;padding:0 6px;border-radius:4px;left:6px;bottom:6px}
label.ph small{background:none;color:var(--muted)}
.ph .x{position:absolute;right:6px;top:6px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;line-height:1;font-size:16px}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.log{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px;max-height:300px;min-height:80px;overflow:auto;font:12px/1.5 var(--mono);white-space:pre-wrap}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
details summary{cursor:pointer;font-weight:600}
.paper-actions{display:flex;justify-content:flex-end;margin:0 auto 10px;max-width:794px}
.logotxt{display:block;line-height:1.25}.logotxt small{display:block;font-weight:500}
.logoimg{max-height:56px;max-width:220px;display:block}
.pane{overflow:hidden}
.three{grid-template-columns:minmax(260px,320px) 1fr minmax(260px,340px)}
#view .ho .sm td{white-space:normal;overflow-wrap:anywhere;height:auto;min-height:24px;line-height:1.25}
.paper.form .shopname small{letter-spacing:0;white-space:nowrap;color:#7a6a2a}
@media screen and (max-width:820px){
  html,body{overflow-x:hidden;max-width:100%}
  .three,.two{grid-template-columns:minmax(0,1fr)!important}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);overflow:visible;gap:0}
  .tab{padding:10px 2px;font-size:13px;white-space:normal;text-align:center;line-height:1.2}
  .paper-wrap .paper{display:none}
  .paper-actions{max-width:none;justify-content:stretch}.paper-actions .btn{width:100%;min-height:46px}
  input,select,textarea{font-size:16px!important}
  .btn{min-height:40px}
  .grid2,.grid3,.dbody{grid-template-columns:minmax(0,1fr)!important}
  input,select,textarea,.f{min-width:0;max-width:100%;box-sizing:border-box}
  .dlg{max-width:100%;width:100%}
  .wrap{padding-left:12px;padding-right:12px}
  .row{grid-template-columns:76px minmax(0,1fr)}
  .row .r{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px}
}
#bookprint{display:none}
@media print{
  body.printing-book>*:not(#bookprint){display:none!important}

<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
'use strict';
/* ====================== ตัวช่วย ====================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const TODAY_ISO=iso(new Date());
const diffDays=(a,b)=>Math.round((parseISO(a)-parseISO(b))/864e5);
const fmtBE=s=>{if(!s)return '-';const [y,m,d]=String(s).slice(0,10).split('-');return d+'/'+m+'/'+(+y+543)};
const money=n=>(Number(n)||0).toLocaleString('en-US');
const num=v=>Number(String(v==null?'':v).replace(/,/g,''))||0;
const C=window.APP_CONFIG||{};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className='show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>t.className='',bad?6000:2600)}

/* ====================== ข้อมูล ====================== */
const DEFAULT_CFG={tax:{on:true,days:30},stale:{on:true,days:90},prep:{on:true,days:1},status:{on:true},newcar:{on:true},daily:{on:true,time:'08:00'},statuses:['พร้อมขาย','จอง','กำลังเตรียม','ขายแล้ว']};
const CHECKS=[['oil','เปลี่ยนถ่ายน้ำมันเครื่อง กรอง'],['gear','เปลี่ยนถ่ายน้ำมันเกียร์'],['diff','เปลี่ยนน้ำมันเฟืองท้าย'],['batt','เปลี่ยนแบตเตอรี่'],['elec','เช็คระบบไฟ'],['ac','เช็คระบบแอร์'],['polish','ขัดไฟ'],['fuel','เติมน้ำมัน'],['film','ติดฟิล์ม'],['wash','ล้างทำความสะอาด'],['dlt','ตรวจสภาพรถ ขนส่ง'],['pra','ตรวจสภาพรถ ตรอ พรบ'],['plug','หัวเทียน'],['paint','เก็บสี']];
const SLOTS=[['front','หน้ารถ'],['book','หน้าเล่ม'],['p16','หน้า 16'],['p18','หน้า 18'],['p20','หน้า 20'],['table','ตารางผ่อน']];
const COLORS={'เทา':'#8d969b','ขาว':'#eef1f1','เงิน':'#b9c1c5','ดำ':'#25292c','แดง':'#a3262c','น้ำเงิน':'#2a4a86','ทอง':'#b79a62','เขียว':'#2f6b4f','น้ำตาล':'#6b4a36','เหลือง':'#d6b43c','ส้ม':'#d9762b'};

let sb=null,me=null;
let cars=[],INSPS={},HOS={},config=structuredClone(DEFAULT_CFG),lineSet={},stateSet={},usage=0,lastLoad=0;
const state={tab:'stock',filter:'พร้อมขาย',q:'',sel:null,mobileDetail:false,busy:false};
const car=id=>cars.find(c=>c.id===id);
const cur=()=>car(state.sel);
const STATUSES=()=>{const s=[...(config.statuses||DEFAULT_CFG.statuses)];cars.forEach(c=>{if(c.status&&!s.includes(c.status))s.push(c.status)});return s};

const newInsp=c=>({appt:'',time:'',buyer:'',phone:'',items:{},fuelAmt:'',custom:'',note:'',docs:{book:false,keys:false,keyN:'',remoteN:'',manual:false,copy:false,service:false,tax:false,taxExp:(c&&c.tax_date)||'',pra:false,praExp:'',ins:false,insType:'',insExp:''}});
const mergeInsp=(data,c)=>{const b=newInsp(c);return {...b,...data,items:(data&&data.items)||{},docs:{...b.docs,...((data&&data.docs)||{})}}};
const insp=id=>INSPS[id]||(INSPS[id]=newInsp(car(id)));
const itemOf=(I,k)=>I.items[k]||(I.items[k]={done:false,date:'',by:''});
const progress=I=>{const ks=CHECKS.map(x=>x[0]);if(String(I.custom||'').trim())ks.push('custom');return {done:ks.filter(k=>I.items[k]&&I.items[k].done).length,total:ks.length}};
const newHo=()=>({name:'',addr:'',idcard:'',phone:'',bank:'',loan:'',chassis:'',engine:'',date:TODAY_ISO,deliver:'',time:'',down:'',transfer:'',premium:'',deposit:'',tradein:'',other:'',balance:'',finContact:'',insType:'',insCo:'',insPhone:'',insOther:'',insExtra:'',fCost:'',fOil:'',fGear:'',fDiff:'',fBatt:'',fOther:'',fOtherLabel:'',note:'',sellerPhone:C.SHOP_PHONE||''});
const ho=id=>HOS[id]||(HOS[id]=newHo());
const calcBalance=h=>(num(h.down)+num(h.transfer)+num(h.premium)+num(h.other))-(num(h.deposit)+num(h.tradein));

async function loadAll(){
  const m=TODAY_ISO.slice(0,7);
  const [c,i,h,s,u]=await Promise.all([
    sb.from('cars').select('*').order('intake',{ascending:false,nullsFirst:false}).range(0,4999),
    sb.from('inspections').select('*').range(0,4999),
    sb.from('handovers').select('*').range(0,4999),
    sb.from('settings').select('*'),
    sb.from('line_usage').select('messages').eq('month',m).maybeSingle()]);
  const err=c.error||i.error||h.error||s.error;
  if(err)throw err;
  cars=c.data||[];
  INSPS={};(i.data||[]).forEach(r=>{const cc=car(r.car_id);if(cc)INSPS[r.car_id]=mergeInsp(r.data,cc)});
  HOS={};(h.data||[]).forEach(r=>{HOS[r.car_id]={...newHo(),...r.data}});
  const S={};(s.data||[]).forEach(r=>S[r.key]=r.value);
  config={...structuredClone(DEFAULT_CFG),...(S.config||{})};lineSet=S.line||{};stateSet=S.state||{};
  usage=(u&&u.data&&u.data.messages)||0;lastLoad=Date.now();
  if(!car(state.sel))state.sel=(cars.find(x=>x.status===state.filter)||cars[0]||{}).id||null;
}

/* บันทึกใบตรวจสภาพ/ใบส่งมอบอัตโนมัติ */
const dirty=new Map();let saveTimer;
const setSave=t=>{const e=$('#savest');if(e)e.textContent=t};
function markDirty(kind,id){dirty.set(kind+':'+id,[kind,id]);setSave('กำลังบันทึก…');clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
async function flush(){
  clearTimeout(saveTimer);const items=[...dirty.values()];dirty.clear();let bad=false;
  for(const [k,id] of items){
    const tbl=k==='insp'?'inspections':'handovers',data=k==='insp'?INSPS[id]:HOS[id];
    const {error}=await sb.from(tbl).upsert({car_id:id,data});
    if(error){bad=true;toast('บันทึกไม่สำเร็จ: '+error.message,true)}
  }
  setSave(bad?'บันทึกไม่สำเร็จ':'บันทึกแล้ว ✓');
}
window.addEventListener('beforeunload',e=>{if(dirty.size){flush();e.preventDefault();e.returnValue=''}});

/* ====================== กฎแจ้งเตือน (เหมือนฝั่งเซิร์ฟเวอร์) ====================== */
function alertsFor(c){
  const out=[];if(c.status==='ขายแล้ว')return out;
  if(config.tax.on&&c.tax_date){
    const d=diffDays(c.tax_date,TODAY_ISO);
    if(d<0)out.push({k:'tax',lv:'crit',n:d,text:'ภาษีขาดแล้ว '+(-d)+' วัน'});
    else if(d===0)out.push({k:'tax',lv:'warn',n:0,text:'ภาษีหมดวันนี้'});
    else if(d<=config.tax.days)out.push({k:'tax',lv:'warn',n:d,text:'ภาษีหมดอีก '+d+' วัน'});
  }
  if(config.stale.on&&c.status==='พร้อมขาย'&&c.intake){
    const a=diffDays(TODAY_ISO,c.intake);
    if(a>config.stale.days)out.push({k:'stale',lv:'warn',n:a,text:'ค้างสต็อก '+a+' วัน'});
  }
  const I=INSPS[c.id];
  if(config.prep.on&&I&&I.appt){
    const p=progress(I),d=diffDays(I.appt,TODAY_ISO);
    if(p.done<p.total&&d<=config.prep.days){
      const when=d<0?'เลยวันนัดส่งมอบ '+(-d)+' วัน':d===0?'นัดส่งมอบวันนี้':'นัดส่งมอบอีก '+d+' วัน';
      out.push({k:'prep',lv:d<=0?'crit':'warn',n:d,text:when+' · เตรียมรถ '+p.done+'/'+p.total});
    }
  }
  return out;
}
const allAlerts=()=>cars.flatMap(c=>alertsFor(c).map(a=>({...a,car:c})));

/* ====================== รูปภาพ ====================== */
const pubUrl=p=>{if(!p)return '';
  if(p.startsWith('drive:')){const [id,w]=p.slice(6).split('@');return 'https://drive.google.com/thumbnail?id='+id+'&sz=w'+(w||1400)}
  return sb.storage.from('cars').getPublicUrl(p).data.publicUrl};

async function printBook(){
  const c=cur();if(!c)return;
  const want=[['book','หน้าเล่ม'],['p16','หน้า 16'],['p18','หน้า 18'],['p20','หน้า 20']].filter(([k])=>c.photos&&c.photos[k]);
  if(!want.length){toast('รถคันนี้ยังไม่มีรูปหน้าเล่ม / หน้า 16 / 18 / 20',true);return}
  document.getElementById('bookprint')?.remove();
  const d=document.createElement('div');d.id='bookprint';
  d.innerHTML=want.map(([k])=>`<div class="bppage"><img src="${esc(pubUrl(c.photos[k]))}" referrerpolicy="no-referrer"></div>`).join('');
  document.body.appendChild(d);toast('กำลังเตรียมรูปสำหรับพิมพ์…');
  await Promise.all([...d.querySelectorAll('img')].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;setTimeout(r,12000)})));
  document.body.classList.add('printing-book');
  const done=()=>{document.body.classList.remove('printing-book');d.remove();window.removeEventListener('afterprint',done)};
  window.addEventListener('afterprint',done);setTimeout(()=>window.print(),150);
}
async function resizeBlob(file,max,q){
  const bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
  const s=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return new Promise(r=>cv.toBlob(r,'image/jpeg',q));
}
async function uploadPhoto(carId,slot,file){
  const c=car(carId),ts=Date.now(),photos={...(c.photos||{})},old=[photos[slot]];
  const up=async(path,blob)=>{const r=await sb.storage.from('cars').upload(path,blob,{contentType:'image/jpeg'});if(r.error)throw r.error};
  const path=carId+'/'+slot+'-'+ts+'.jpg';await up(path,await resizeBlob(file,1400,.82));photos[slot]=path;
  if(slot==='front'){const tp=carId+'/front-'+ts+'-t.jpg';await up(tp,await resizeBlob(file,360,.75));old.push(photos.front_t);photos.front_t=tp}
  const {error}=await sb.from('cars').update({photos}).eq('id',carId);if(error)throw error;
  c.photos=photos;sb.storage.from('cars').remove(old.filter(Boolean));
}
async function removePhoto(carId,slot){
  const c=car(carId),photos={...(c.photos||{})},old=[photos[slot]];delete photos[slot];
  if(slot==='front'){old.push(photos.front_t);delete photos.front_t}
  const {error}=await sb.from('cars').update({photos}).eq('id',carId);if(error)throw error;
  c.photos=photos;sb.storage.from('cars').remove(old.filter(Boolean));
}

/* ====================== ส่วนแสดงผลร่วม ====================== */
const carSvg=color=>{const c=COLORS[color]||'#8d969b';return `<svg viewBox="0 0 120 60" aria-hidden="true"><path d="M8 40 L14 30 Q18 26 26 25 L40 14 Q44 11 50 11 L78 11 Q84 11 88 15 L98 25 Q108 26 112 32 L114 40 Q114 44 110 44 L10 44 Q8 44 8 40Z" fill="${c}" stroke="rgba(0,0,0,.35)" stroke-width="1"/><path d="M43 25 L52 15 L66 15 L66 25Z" fill="#cfe2e8" opacity=".85"/><path d="M70 25 L70 15 L78 15 Q81 15 83 18 L90 25Z" fill="#cfe2e8" opacity=".85"/><circle cx="32" cy="44" r="8" fill="#1d2326"/><circle cx="32" cy="44" r="3" fill="#cfd6d9"/><circle cx="88" cy="44" r="8" fill="#1d2326"/><circle cx="88" cy="44" r="3" fill="#cfd6d9"/></svg>`};
const plateText=c=>((c.plate||'')+' '+(c.province||'')).trim();
const plateHtml=(c,lg)=>`<span class="plate${lg?' lg':''}"><b>${esc(c.plate)}</b><i>${esc(c.province)}</i></span>`;
const pillHtml=a=>`<span class="pill ${a.lv}">${esc(a.text)}</span>`;
const statusPill=s=>`<span class="pill ${s==='พร้อมขาย'?'ok':s==='ขายแล้ว'?'mute':'warn'}">${esc(s)}</span>`;
const thumbHtml=c=>{const p=c.photos&&(c.photos.front_t||c.photos.front);return p?`<img src="${esc(pubUrl(p))}" alt="" loading="lazy">`:carSvg(c.color)};
const noCar=()=>`<div class="card"><div class="empty">ยังไม่มีรถในระบบ — ไปที่แท็บ “สต็อกรถ” กด + เพิ่ม หรือแท็บ “ข้อมูล” เพื่อนำเข้าจาก Google Sheet</div></div>`;
const logoHtml=short=>C.LOGO_URL?`<img class="logoimg" src="${esc(C.LOGO_URL)}" alt="${esc(C.SHOP_NAME)}">`:`<span class="logotxt">${esc(C.SHOP_NAME||'')}<small>${short?'':esc(C.SHOP_TAGLINE||'')+' '}${esc(C.SHOP_PHONE||'')}</small></span>`;

/* ====================== หน้าล็อกอิน ====================== */
function renderLogin(msg,email){
  $('#app').innerHTML=`<div class="login"><form class="card" data-form="login"><h1 style="margin:0;font-size:24px;letter-spacing:.06em">STOCK</h1>
   <p class="hint">ระบบสต็อกรถมือสอง ${esc(C.SHOP_NAME||'')}</p>
   <label class="f">อีเมล<input type="text" name="email" autocomplete="username" inputmode="email" value="${esc(email||'')}" required></label>
   <label class="f">รหัสผ่าน<input type="password" name="password" autocomplete="current-password" required></label>
   ${msg?`<div class="pill crit" style="justify-self:start">${esc(msg)}</div>`:''}
   <button class="btn pri" type="submit">เข้าสู่ระบบ</button></form></div>`;
}

/* ====================== โครงหน้า ====================== */
function renderTabs(){
  const n=allAlerts().length;
  const t=[['stock','🚗','สต็อกรถ'],['alerts','🔔','แจ้งเตือน'],['inspect','📋','ตรวจสภาพ'],['handover','📄','ใบส่งมอบ'],['data','⚙️','ข้อมูล']];
  const el=$('#tabs');if(!el)return;
  el.innerHTML=t.map(([k,i,l])=>`<button class="tab" role="tab" aria-selected="${state.tab===k}" data-act="tab" data-v="${k}"><span class="ti" aria-hidden="true">${i}</span><span class="tl">${l}</span>${k==='alerts'&&n?`<span class="badge">${n}</span>`:''}</button>`).join('');

function shell(){

async function callTick(action){
  state.busy=true;
  try{
    const {data,error}=await sb.functions.invoke('tick',{body:{action}});
    if(error){let m=error.message;try{const j=await error.context.json();m=j.error||m}catch(e){}throw new Error(m)}
    if(data&&data.ok===false)throw new Error(data.error||'ไม่สำเร็จ');
    return data;
  }finally{state.busy=false}
}

const logLine=t=>{imp.log+=t+'\n';const e=$('#implog');if(e){e.textContent=imp.log;e.scrollTop=e.scrollHeight}};

function parseCSV(text){
  text=text.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;
    else if(ch===','){row.push(f);f=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}
    else f+=ch}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
const HDR={'วัน/เดือน/ปี':'intake','สถานะ':'status','เพิ่มเติม':'extra','ทะเบียน':'plate','ภาษีขาด':'tax_date','ยี่ห้อ':'brand','รุ่น':'model','รุ่นย่อย':'submodel','ปีค.ศ.':'year','สี':'color','เลขไมล์':'mileage','ลักษณะ':'feature','เชื้อเพลิง':'fuel','ขนาดเครื่องยนต์':'cc','เกียร์':'gear','วันขาย':'sold_date','ราคาขาย':'price','ผ่อนเริ่มต้น':'installment_start','เบอร์โทรคนซื้อ':'buyer_phone','ผู้ซื้อ':'buyer','สถานะเอกสาร':'doc_status','หมายเหตุ':'note'};
function splitPlate(raw){
  let s=String(raw||'').replace(/\s+/g,' ').trim();if(!s)return null;
  const t=s.split(' ');let prov='';
  if(t.length>=2){const last=t[t.length-1].replace(/\.+$/,'');if(/^[฀-๿]+$/.test(last)&&!/[0-9]/.test(last)&&t.slice(0,-1).some(x=>/\d/.test(x))){prov=last;t.pop()}}
  return {plate:t.join(' ').replace(/\.+$/,''),province:prov};
}
function mkDate(y,m,d){if(y>2400)y-=543;else if(y<100)y+=2000;if(m<1||m>12||d<1||d>31||y<1990||y>2100)return null;return y+'-'+pad(m)+'-'+pad(d)}
function parseDate(s,order){
  s=String(s||'').trim();if(!s)return null;let m;
  if(m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))return mkDate(+m[1],+m[2],+m[3]);
  if(m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/)){const a=+m[1],b=+m[2];return order==='mdy'?mkDate(+m[3],a,b):mkDate(+m[3],b,a)}
  return null;
}
const toNum=v=>{const s=String(v==null?'':v).replace(/[,\s฿]/g,'');if(s==='')return null;const n=Number(s);return isFinite(n)?n:null};
function detectOrder(rowsets){
  let dm=0,md=0;
  rowsets.forEach(({rows,idx})=>rows.forEach(r=>idx.dates.forEach(ci=>{const m=String(r[ci]||'').match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.]\d{2,4}/);if(m){if(+m[1]>12)dm++;if(+m[2]>12)md++}})));
  return md>dm?'mdy':'dmy';
}
function readTable(text){
  const all=parseCSV(text);if(!all.length)return null;
  const head=all[0].map(h=>String(h).replace(/\s+/g,'').trim());
  const map={};head.forEach((h,i)=>{if(HDR[h]&&!(HDR[h] in map))map[HDR[h]]=i});
  const dates=['intake','tax_date','sold_date'].filter(k=>k in map).map(k=>map[k]);
  return {rows:all.slice(1),map,idx:{dates}};
}
function buildCars(tbl,order,isSold){
  const out=[],bad={dates:0,noPlate:0};
  const g=(r,k)=>k in tbl.map?String(r[tbl.map[k]]==null?'':r[tbl.map[k]]).trim():'';
  tbl.rows.forEach(r=>{
    const p=splitPlate(g(r,'plate'));if(!p){bad.noPlate++;return}
    const dt=k=>{const v=g(r,k);if(!v)return null;const d=parseDate(v,order);if(!d)bad.dates++;return d};
    const price=toNum(g(r,'price'));
    out.push({plate:p.plate,province:p.province,intake:dt('intake'),tax_date:dt('tax_date'),brand:g(r,'brand'),model:g(r,'model'),submodel:g(r,'submodel'),
      year:toNum(g(r,'year')),color:g(r,'color'),mileage:toNum(g(r,'mileage')),feature:g(r,'feature'),fuel:g(r,'fuel'),cc:toNum(g(r,'cc')),gear:g(r,'gear'),
      status:g(r,'status')||(isSold?'ขายแล้ว':'พร้อมขาย'),extra:g(r,'extra'),note:g(r,'note'),price,
      sold_date:dt('sold_date'),sold_price:isSold?price:null,installment_start:g(r,'installment_start'),buyer:g(r,'buyer'),buyer_phone:g(r,'buyer_phone'),doc_status:g(r,'doc_status')});
  });
  return {out,bad};
}
function prepareImport(){
  const sets=['cars','sold'].filter(k=>imp[k]).map(k=>({k,...imp[k]}));
  if(!sets.length){$('#impprev').textContent='';$('#impbtn').disabled=true;return}
  const sel=$('#dfmt').value,order=sel==='auto'?detectOrder(sets):sel;
  let total=0,badD=0,badP=0,sample=[];
  imp.built=[];
  sets.forEach(s=>{const {out,bad}=buildCars(s,order,s.k==='sold');imp.built.push(...out);total+=out.length;badD+=bad.dates;badP+=bad.noPlate;if(!sample.length)sample=out.slice(0,2)});
  const miss=sets.filter(s=>!('plate' in s.map)).length;
  $('#impprev').innerHTML=miss?`<span class="pill crit">ไฟล์ไม่มีคอลัมน์ “ทะเบียน” — เลือกไฟล์ผิดหรือไม่?</span>`:
    `พบรถ <b>${total}</b> คัน · อ่านวันที่แบบ <b>${order==='dmy'?'วัน/เดือน/ปี':'เดือน/วัน/ปี'}</b>${badD?` · <span class="pill warn">วันที่อ่านไม่ได้ ${badD} ช่อง</span>`:''}${badP?` · ข้ามแถวที่ไม่มีทะเบียน ${badP}`:''}
     <br>ตัวอย่าง: ${sample.map(c=>esc(plateText(c))+' '+esc(c.model)+' รับเข้า '+fmtBE(c.intake)+' ภาษี '+fmtBE(c.tax_date)).join(' | ')}<br><b>ตรวจตัวอย่างว่าวันที่ถูกต้องก่อนกดนำเข้า</b>`;
  $('#impbtn').disabled=miss>0||!total;
}
async function setPaused(v){const {error}=await sb.from('settings').upsert({key:'state',value:{...stateSet,paused:v}});if(error)throw error;stateSet={...stateSet,paused:v}}
async function doImport(){
  if(state.busy)return;state.busy=true;$('#impbtn').disabled=true;
  const start=new Date().toISOString();
  try{
    await setPaused(true);
    // รวมรายการซ้ำทะเบียนในไฟล์ (ใช้แถวหลังสุด) แล้วนำเข้าเป็นชุด
    const byKey=new Map();imp.built.forEach(c=>byKey.set(c.plate+'|'+c.province,c));
    const rows=[...byKey.values()];let done=0;
    for(let i=0;i<rows.length;i+=40){
      const chunk=rows.slice(i,i+40);
      const {error}=await sb.from('cars').upsert(chunk,{onConflict:'plate,province'});
      if(error)throw error;done+=chunk.length;logLine('นำเข้าแล้ว '+done+'/'+rows.length);
    }
    const sts=[...new Set(rows.map(r=>r.status).filter(Boolean))];
    const merged=[...(config.statuses||[])];sts.forEach(s=>{if(!merged.includes(s))merged.push(s)});
    if(merged.length!==(config.statuses||[]).length){config.statuses=merged;await saveConfig()}
    await sb.from('events').delete().gte('created_at',start).is('sent_at',null);
    logLine('✓ นำเข้าเสร็จ '+rows.length+' คัน (ไม่ส่งแจ้งเตือนเข้า LINE)');toast('นำเข้าเสร็จ '+rows.length+' คัน');
  }catch(e){logLine('✗ ผิดพลาด: '+(e.message||e));toast('นำเข้าไม่สำเร็จ: '+(e.message||e),true)}
  finally{try{await setPaused(false)}catch(e){logLine('⚠ ปลดหยุดแจ้งเตือนไม่สำเร็จ ให้กด ↻ แล้วลองนำเข้าใหม่')}state.busy=false;await loadAll();render()}
}
const SLOTKEY={'รูป':'front','หน้ารถ':'front','หน้าเล่ม':'book','หน้า16':'p16','หน้า18':'p18','หน้า20':'p20','ตารางผ่อน':'table'};
const norm=s=>String(s||'').replace(/[\s.]+/g,'');
function matchPhoto(file){
  let n=file.name.replace(/\.[A-Za-z0-9]+$/,'').replace(/\.\d+$/,'');
  const i=n.indexOf('.ที่อยู่');if(i<0)return null;
  const slot=SLOTKEY[norm(n.slice(i+'.ที่อยู่'.length))];if(!slot)return null;
  const key=norm(n.slice(0,i));
  const c=cars.find(x=>norm(x.plate+x.province)===key)||cars.find(x=>norm(x.plate)===key);
  return c?{car:c,slot}:null;
}
function preparePhotos(){
  const files=imp.photos;let ok=0,miss=[];imp.photoJobs=[];
  files.forEach(f=>{const m=matchPhoto(f);if(m){imp.photoJobs.push({file:f,...m});ok++}else miss.push(f.name)});
  $('#phprev').innerHTML=`เลือก ${files.length} ไฟล์ · จับคู่ได้ <b>${ok}</b>${miss.length?` · จับคู่ไม่ได้ <span class="pill warn">${miss.length}</span> <span class="hint">(เช่น ${esc(miss.slice(0,3).join(', '))})</span>`:''}`;
  $('#phbtn').disabled=!ok;
}
async function doPhotos(){
  if(state.busy)return;state.busy=true;$('#phbtn').disabled=true;
  const over=$('#overwrite').checked;let n=0,skip=0,fail=0;
  const jobs=imp.photoJobs.filter(j=>{if(!over&&j.car.photos&&j.car.photos[j.slot]){skip++;return false}return true});
  // รถคันเดียวกันต้องทำทีละรูป (อัปเดต photos ทีละช่อง) คันต่างกันทำพร้อมกันได้
  const groups=new Map();jobs.forEach(j=>{if(!groups.has(j.car.id))groups.set(j.car.id,[]);groups.get(j.car.id).push(j)});
  const queue=[...groups.values()];
  const worker=async()=>{while(queue.length){const g=queue.shift();for(const j of g){try{await uploadPhoto(j.car.id,j.slot,j.file);n++}catch(e){fail++;logLine('✗ '+j.file.name+': '+(e.message||e))}
    logLine(`อัปโหลดแล้ว ${n}/${jobs.length}${fail?' · ผิดพลาด '+fail:''}`)}}};
  await Promise.all([worker(),worker(),worker()]);
  logLine(`✓ เสร็จ: อัปโหลด ${n} รูป · ข้าม ${skip} (มีรูปอยู่แล้ว) · ผิดพลาด ${fail}`);toast('อัปโหลดรูปเสร็จ '+n+' รูป',fail>0);
  state.busy=false;await loadAll();render();
}
function exportCSV(){
  const cols=[['plate','ทะเบียน'],['province','จังหวัด'],['intake','วันรับเข้า'],['status','สถานะ'],['tax_date','ภาษีขาด'],['brand','ยี่ห้อ'],['model','รุ่น'],['submodel','รุ่นย่อย'],['year','ปี ค.ศ.'],['color','สี'],['mileage','เลขไมล์'],['feature','ลักษณะ'],['fuel','เชื้อเพลิง'],['cc','ขนาดเครื่องยนต์'],['gear','เกียร์'],['price','ราคาขาย'],['extra','เพิ่มเติม'],['note','หมายเหตุ'],['sold_date','วันขาย'],['sold_price','ราคาที่ขายได้'],['buyer','ผู้ซื้อ'],['buyer_phone','เบอร์โทรคนซื้อ'],['installment_start','ผ่อนเริ่มต้น'],['doc_status','สถานะเอกสาร']];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv='﻿'+[cols.map(c=>q(c[1])).join(',')].concat(cars.map(c=>cols.map(([k])=>q(c[k])).join(','))).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='stock-'+TODAY_ISO+'.csv';document.body.appendChild(a);a.click();a.remove();
}

async function saveConfig(){const {error}=await sb.from('settings').upsert({key:'config',value:config});if(error){toast('บันทึกการตั้งค่าไม่สำเร็จ: '+error.message,true);return false}return true}

   ${sel('gear','เกียร์',['ออโต้','ธรรมดา'])}${sel('fuel','เชื้อเพลิง',['เบนซิน','ดีเซล','LPG','CNG','ไฮบริด','ไฟฟ้า'])}${sel('feature','ลักษณะ',['เก๋ง','กระบะ','SUV','แฮทช์แบ็ก','ตู้','อื่นๆ'])}
   ${sel('status','สถานะ',STATUSES())}${inp('intake','วันที่รับเข้า','date')}${inp('tax_date','ภาษีขาด','date')}</div>

   <div class="acts">${c?'<button type="button" class="btn danger" data-act="delCar" style="margin-right:auto">ลบรถคันนี้</button>':''}<button type="button" class="btn" data-act="closeModal">ยกเลิก</button><button class="btn pri" type="submit">บันทึก</button></div></form></div>`;
  const first=$('#modal input');if(first)first.focus();

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,v=t.dataset.v;
  if(a==='closeModal'){if(e.target.closest('.dlg')&&!t.matches('button'))return;$('#modal').innerHTML='';return}
  if(a==='tab'){flush();state.tab=v;state.mobileDetail=false;render()}
  else if(a==='filter'){state.filter=v;renderList()}
  else if(a==='select'){state.sel=v;state.mobileDetail=true;renderList();renderDetail();$('.stock').classList.add('show-detail');window.scrollTo(0,0)}
  else if(a==='back'){state.mobileDetail=false;$('.stock').classList.remove('show-detail')}
  else if(a==='open'){state.sel=v;state.tab='stock';state.filter='ทั้งหมด';state.mobileDetail=true;render()}
  else if(a==='goto'){flush();state.tab=v;render()}
  else if(a==='add')openCarForm(null);
  else if(a==='edit')openCarForm(cur());
  else if(a==='reload'){try{await loadAll();render();toast('โหลดข้อมูลล่าสุดแล้ว')}catch(err){toast('โหลดไม่สำเร็จ: '+err.message,true)}}
  else if(a==='logout'){await flush();await sb.auth.signOut();me=null;renderLogin()}
  else if(a==='print'){window.print()}
  else if(a==='printBook')printBook();
  else if(a==='export')exportCSV();
  else if(a==='doImport')doImport();
  else if(a==='doPhotos')doPhotos();
  else if(a==='setStatus'){
    const c=cur();if(!c||c.status===v)return;
    const {error}=await sb.from('cars').update({status:v}).eq('id',c.id);
    if(error){toast('เปลี่ยนสถานะไม่สำเร็จ: '+error.message,true);return}
    c.status=v;renderTabs();renderList();renderDetail();toast('เปลี่ยนสถานะเป็น “'+v+'” แล้ว');
  }
  else if(a==='rmPhoto'){
    if(!confirm('ลบรูปนี้?'))return;
    try{await removePhoto(state.sel,v);renderList();renderDetail()}catch(err){toast('ลบรูปไม่สำเร็จ: '+err.message,true)}
  }
  else if(a==='delCar'){
    const c=cur();if(!c||!confirm('ลบรถ '+plateText(c)+' ถาวร? (รวมใบตรวจสภาพและใบส่งมอบของคันนี้)'))return;
    const {error}=await sb.from('cars').delete().eq('id',c.id);
    if(error){toast('ลบไม่สำเร็จ: '+error.message,true);return}
    const paths=Object.values(c.photos||{});if(paths.length)sb.storage.from('cars').remove(paths);
    cars=cars.filter(x=>x.id!==c.id);state.sel=(cars.find(x=>x.status===state.filter)||cars[0]||{}).id||null;$('#modal').innerHTML='';render();toast('ลบแล้ว');
  }
  else if(a==='saveStatuses'){
    const list=$('#stlist').value.split(/[,،]/).map(s=>s.trim()).filter(Boolean);
    for(const must of ['พร้อมขาย','ขายแล้ว'])if(!list.includes(must)){toast('ต้องมี “'+must+'” ในรายการ',true);return}
    config.statuses=[...new Set(list)];if(await saveConfig()){toast('บันทึกรายการสถานะแล้ว');render()}
  }
  else if(a==='tick'){
    if(state.busy)return;t.disabled=true;
    try{
      const r=await callTick(v);
      if(v==='quota'){$('#quotaout').textContent=r.limit==null?`ใช้ไปแล้ว ${r.used} ข้อความเดือนนี้ (แพ็กเกจไม่จำกัด)`:`ใช้ไปแล้ว ${r.used} จาก ${r.limit} ข้อความเดือนนี้`}
      else{toast('ส่งเข้ากลุ่ม LINE แล้ว ✓');usage+=1}
    }catch(err){toast('ไม่สำเร็จ: '+err.message,true)}
    t.disabled=false;
  }
});
document.addEventListener('input',e=>{

document.addEventListener('change',async e=>{
  const ph=e.target.closest('[data-photo]');
  if(ph&&ph.files[0]){
    const slot=ph.dataset.photo,id=state.sel;toast('กำลังอัปโหลดรูป…');

    if(k==='photos'){imp.photos=[...im.files];preparePhotos();return}

  else if(p[0]==='dcb'){insp(state.sel).docs[p[1]]=t.checked;updateInspPaper();markDirty('insp',state.sel)}
});

document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').innerHTML=''});
